version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: arvyax_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arvyax
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: arvyax
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvyax"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arvyax_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://arvyax:secret@db:5432/arvyax
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_ENV: production
      ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # ── Next.js Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arvyax_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3001"

volumes:
  pgdata:
